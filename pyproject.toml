[project]
name = "virtual-graph-dbx"
version = "0.1.0"
description = "Run Finance Genie plain-Cypher fraud queries against the Neo4j Virtual Graph"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Used only by `--demo 100m` to run SQL on the warehouse and read query history for
# spill metrics. The core demos need only neo4j + python-dotenv.
history = ["databricks-sdk>=0.30"]

[project.scripts]
vg-demo = "cli:main"
vg-probe = "probe:main"
vg-viz = "viz_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 754" width="960" role="img" aria-labelledby="t d">
  <title id="t">Identity flow for Virtual Graph on AWS</title>
  <desc id="d">A user creates a read-only IAM role, obtains temporary credentials, pastes them into the Aura data source form, the Graph Engine passes them to DuckDB, and Amazon S3 Tables authorizes every request against the role policy, which is the access boundary.</desc>
  <rect width="960" height="754" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 z" fill="#374151"/>
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1F2937">

    <!-- Title -->
    <text x="20" y="30" font-size="18" font-weight="bold">Identity flow from AWS credentials to Amazon S3 Tables</text>

    <!-- Return arrow: S3 Tables checks policy from step 1 -->
    <path d="M863 88 V64 H132 V88" fill="none" stroke="#374151" stroke-width="1.75" marker-end="url(#arrow)"/>
    <rect x="362" y="54" width="270" height="20" fill="#FFFFFF"/>
    <text x="497" y="68" font-size="12" text-anchor="middle">Checked against the policy from step 1</text>

    <!-- Access boundary line (broken around the 4 to 5 arrow) -->
    <path d="M776 78 V210 M776 222 V356" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 4"/>
    <rect x="720" y="356" width="112" height="20" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="776" y="370" font-size="12" font-weight="bold" text-anchor="middle">Access boundary</text>

    <!-- Step boxes -->
    <!-- 1 IAM role -->
    <rect x="20" y="88" width="224" height="256" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.5"/>
    <text x="36" y="124" font-size="15" font-weight="bold">AWS IAM role</text>
    <text x="36" y="142">with a read-only policy</text>
    <text x="36" y="160" font-size="12" fill="#6B7280">Owned by the user</text>
    <rect x="36" y="172" width="192" height="117" rx="6" fill="#FFFFFF" stroke="#E8890C" stroke-width="1"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <text x="45" y="189">GetTableBucket</text>
      <text x="45" y="204">ListNamespaces</text>
      <text x="45" y="219">GetNamespace</text>
      <text x="45" y="234">ListTables</text>
      <text x="45" y="249">GetTable</text>
      <text x="45" y="264">GetTableMetadataLocation</text>
      <text x="45" y="279">GetTableData</text>
    </g>
    <text x="36" y="309" font-size="12">No write, create, or delete</text>
    <text x="36" y="324" font-size="12">actions.</text>

    <!-- 2 Temporary credentials -->
    <rect x="264" y="88" width="154" height="256" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="280" y="124" font-size="15" font-weight="bold">Temporary</text>
    <text x="280" y="142" font-size="15" font-weight="bold">credentials</text>
    <text x="280" y="164" font-size="12">Assume the role,</text>
    <text x="280" y="180" font-size="12">for example from</text>
    <text x="280" y="196" font-size="12">an SSO session</text>
    <text x="280" y="220" font-size="12" fill="#6B7280">Output</text>
    <text x="280" y="238" font-size="12">AWS Key</text>
    <text x="280" y="254" font-size="12">AWS Secret</text>
    <text x="280" y="270" font-size="12">AWS Session Token</text>

    <!-- 3 Aura data source -->
    <rect x="438" y="88" width="154" height="256" rx="8" fill="#E8F1FB" stroke="#2563EB" stroke-width="1.5"/>
    <text x="454" y="124" font-size="15" font-weight="bold">Aura data</text>
    <text x="454" y="142" font-size="15" font-weight="bold">source</text>
    <text x="454" y="164" font-size="12">User pastes key,</text>
    <text x="454" y="180" font-size="12">secret, session</text>
    <text x="454" y="196" font-size="12">token, and region</text>
    <text x="454" y="212" font-size="12">into the AWS S3</text>
    <text x="454" y="228" font-size="12">Tables form.</text>
    <rect x="454" y="242" width="122" height="57" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
    <text x="462" y="266" font-size="12">Stored by Aura</text>
    <text x="462" y="282" font-size="12">for the instance</text>

    <!-- 4 Graph Engine + DuckDB -->
    <rect x="612" y="88" width="154" height="256" rx="8" fill="#E8F1FB" stroke="#2563EB" stroke-width="1.5"/>
    <text x="628" y="124" font-size="15" font-weight="bold">Graph Engine</text>
    <text x="628" y="146" font-size="12">Builds a DuckDB</text>
    <text x="628" y="162" font-size="12">AWS secret from</text>
    <text x="628" y="178" font-size="12">those values</text>
    <rect x="628" y="190" width="122" height="106" rx="6" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.5"/>
    <text x="636" y="208" font-size="14" font-weight="bold">DuckDB</text>
    <text x="636" y="224" font-size="12" fill="#6B7280">Self-managed:</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <text x="636" y="240">secret.json</text>
      <text x="636" y="255">type aws.key</text>
    </g>
    <text x="636" y="271" font-size="12" fill="#6B7280">Optional:</text>
    <text x="636" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">sessionToken</text>
    <text x="628" y="316" font-size="12">Used for every read</text>

    <!-- 5 S3 Tables -->
    <rect x="786" y="88" width="154" height="256" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.5"/>
    <text x="802" y="124" font-size="15" font-weight="bold">Amazon S3</text>
    <text x="802" y="142" font-size="15" font-weight="bold">Tables</text>
    <text x="802" y="164" font-size="12">Authorizes each</text>
    <text x="802" y="180" font-size="12">request against</text>
    <text x="802" y="196" font-size="12">the IAM policy</text>
    <text x="802" y="212" font-size="12">from step 1</text>

    <!-- Flow arrows between steps -->
    <g fill="none" stroke="#374151" stroke-width="1.75" marker-end="url(#arrow)">
      <path d="M244 216 H264" marker-end="url(#arrow)"/>
      <path d="M418 216 H438" marker-end="url(#arrow)"/>
      <path d="M592 216 H612" marker-end="url(#arrow)"/>
      <path d="M766 216 H786" marker-end="url(#arrow)"/>
    </g>

    <!-- Step numbers -->
    <g font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      <circle cx="44" cy="88" r="12" fill="#1F2937" stroke="#FFFFFF" stroke-width="2"/>
      <text x="44" y="92">1</text>
      <circle cx="288" cy="88" r="12" fill="#1F2937" stroke="#FFFFFF" stroke-width="2"/>
      <text x="288" y="92">2</text>
      <circle cx="462" cy="88" r="12" fill="#1F2937" stroke="#FFFFFF" stroke-width="2"/>
      <text x="462" y="92">3</text>
      <circle cx="636" cy="88" r="12" fill="#1F2937" stroke="#FFFFFF" stroke-width="2"/>
      <text x="636" y="92">4</text>
      <circle cx="810" cy="88" r="12" fill="#1F2937" stroke="#FFFFFF" stroke-width="2"/>
      <text x="810" y="92">5</text>
    </g>

    <!-- Connectors from tier 1 to tier 2 -->
    <path d="M132 344 V388" fill="none" stroke="#059669" stroke-width="2"/>
    <path d="M341 344 V388" fill="none" stroke="#6B7280" stroke-width="1.5"/>

    <!-- Alternative path arrow -->
    <path d="M689 388 V344" fill="none" stroke="#374151" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <rect x="398" y="357" width="284" height="20" fill="#FFFFFF"/>
    <text x="676" y="371" font-size="12" text-anchor="end">Self-managed only</text>

    <!-- Tier 2: boundary callout -->
    <rect x="20" y="388" width="224" height="148" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="3"/>
    <g font-size="16" font-weight="bold" text-anchor="middle">
      <text x="132" y="450">IAM scope on the</text>
      <text x="132" y="472">credentials is the</text>
      <text x="132" y="494">access boundary.</text>
    </g>

    <!-- Tier 2: SSO note -->
    <rect x="264" y="388" width="328" height="148" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
    <g font-size="12">
      <text x="280" y="422">SSO sessions last at most one hour. After</text>
      <text x="280" y="439">expiry the Virtual Graph loses access until</text>
      <text x="280" y="456">new values are pasted into the data source.</text>
      <text x="280" y="488">A long-lived IAM user key avoids refresh</text>
      <text x="280" y="505">where an organization allows it.</text>
    </g>

    <!-- Tier 2: aws.chain alternative -->
    <rect x="612" y="388" width="328" height="148" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="628" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">secret.json type aws.chain</text>
    <text x="628" y="433" font-size="12">Delegates to the AWS SDK credential chain</text>
    <text x="628" y="459" font-size="12" fill="#6B7280">Chain values</text>
    <text x="628" y="474" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">config, sts, sso, env, web_identity</text>
    <text x="628" y="500" font-size="12" fill="#6B7280">Fields</text>
    <text x="628" y="515" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">profile, role, externalId, tokenFile</text>

    <!-- Tier 3: supporting notes -->
    <rect x="20" y="552" width="450" height="88" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
    <text x="36" y="582" font-weight="bold">No RBAC on traversal.</text>
    <text x="36" y="602">There is no stored graph, and Neo4j rules do not</text>
    <text x="36" y="622">map to source side row access.</text>

    <rect x="490" y="552" width="450" height="88" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
    <text x="506" y="582" font-weight="bold">Every Aura user queries as a reader.</text>
    <text x="506" y="602">Only some project roles can create, change, or</text>
    <text x="506" y="622">delete a Virtual Graph.</text>

    <!-- Troubleshooting -->
    <rect x="20" y="654" width="920" height="80" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
    <g font-size="12">
      <text x="36" y="682"><tspan font-weight="bold">Troubleshooting.</tspan> S3 403 errors can surface as credentials errors. Check CloudTrail for the denied s3tables action.</text>
      <text x="36" y="699">ListTables and GetTable are management events.</text>
      <text x="36" y="716">GetTableData is a data event and appears only in a trail that logs S3 Tables data events.</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 608" width="960" role="img" aria-labelledby="t d">
  <title id="t">Architecture at a glance</title>
  <desc id="d">Cypher clients connect over Bolt to an Aura Virtual Graph instance, where the Graph Engine sends SQL over JDBC to embedded DuckDB, which reads Iceberg tables in Amazon S3 Tables, while Aura handles setup and schema discovery.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="608" fill="#FFFFFF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1F2937">

    <text x="24" y="34" font-size="18" font-weight="700">Neo4j Virtual Graph on AWS</text>

    <!-- Cypher clients -->
    <rect x="24" y="99" width="140" height="150" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
    <text x="40" y="125" font-size="15" font-weight="700">Cypher clients</text>
    <text x="40" y="149">Query</text>
    <text x="40" y="169">Bloom</text>
    <text x="40" y="189">Explore</text>
    <text x="40" y="209">Aura Agent</text>
    <text x="40" y="229">drivers</text>

    <!-- Aura Virtual Graph instance -->
    <rect x="232" y="56" width="370" height="360" rx="8" fill="#F5F9FE" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="252" y="82" font-size="15" font-weight="700">Aura Virtual Graph instance</text>
    <text x="252" y="100" font-size="12" fill="#6B7280">stateless pod, one per graph</text>

    <rect x="252" y="118" width="330" height="112" rx="8" fill="#E8F1FB" stroke="#2563EB" stroke-width="1.5"/>
    <text x="268" y="144" font-size="15" font-weight="700">Graph Engine</text>
    <text x="268" y="166">Cypher parse, rewrite, relational AST</text>
    <text x="268" y="186">Dialect renders SQL</text>
    <text x="268" y="206">JDBC external operators</text>

    <!-- Bolt arrow -->
    <line x1="164" y1="174" x2="252" y2="174" stroke="#374151" stroke-width="1.75" marker-end="url(#arrow)"/>
    <rect x="176" y="164" width="44" height="20" fill="#FFFFFF"/>
    <text x="198" y="179" font-size="12" text-anchor="middle">Bolt</text>

    <line x1="417" y1="230" x2="417" y2="290" stroke="#374151" stroke-width="1.75" marker-end="url(#arrow)"/>
    <rect x="371" y="250" width="92" height="20" fill="#FFFFFF"/>
    <text x="417" y="264" font-size="12" text-anchor="middle">SQL over JDBC</text>

    <rect x="252" y="290" width="330" height="110" rx="8" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.5"/>
    <text x="268" y="316" font-size="15" font-weight="700">Embedded DuckDB</text>
    <text x="268" y="338">in memory, JDBC driver</text>
    <text x="268" y="358">S3 table bucket attached as</text>
    <text x="268" y="378">catalog virtual_graph</text>

    <!-- DuckDB to S3 Tables -->
    <line x1="582" y1="343" x2="736" y2="343" stroke="#374151" stroke-width="1.75" marker-end="url(#arrow)"/>
    <rect x="613" y="324" width="112" height="38" fill="#FFFFFF"/>
    <text x="669" y="338" font-size="12" text-anchor="middle">Iceberg REST,</text>
    <text x="669" y="354" font-size="12" text-anchor="middle">AWS credentials</text>

    <!-- Legend -->
    <text x="736" y="72" font-size="12" font-weight="700">Legend</text>
    <rect x="736" y="84" width="14" height="14" rx="3" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
    <text x="758" y="95" font-size="12">Clients</text>
    <rect x="736" y="104" width="14" height="14" rx="3" fill="#E8F1FB" stroke="#2563EB" stroke-width="1.5"/>
    <text x="758" y="115" font-size="12">Neo4j components</text>
    <rect x="736" y="124" width="14" height="14" rx="3" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.5"/>
    <text x="758" y="135" font-size="12">DuckDB</text>
    <rect x="736" y="144" width="14" height="14" rx="3" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.5"/>
    <text x="758" y="155" font-size="12">AWS storage</text>
    <rect x="736" y="164" width="14" height="14" rx="3" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="758" y="175" font-size="12">Aura setup</text>

    <!-- Amazon S3 Tables -->
    <rect x="736" y="192" width="200" height="224" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.5"/>
    <text x="752" y="218" font-size="15" font-weight="700">Amazon S3 Tables</text>
    <rect x="748" y="230" width="176" height="174" rx="8" fill="#FFFBF5" stroke="#E8890C" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="762" y="252">Table bucket</text>
    <rect x="760" y="262" width="152" height="130" rx="8" fill="#FFFBF5" stroke="#E8890C" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="774" y="284">Namespace</text>
    <rect x="772" y="306" width="128" height="74" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.5"/>
    <text x="836" y="347" text-anchor="middle">Iceberg tables</text>

    <!-- Aura band -->
    <rect x="24" y="460" width="912" height="124" rx="8" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="44" y="486" font-size="15" font-weight="700">Aura: setup and schema discovery</text>

    <rect x="44" y="504" width="120" height="56" rx="8" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="104" y="537" font-size="15" font-weight="700" text-anchor="middle">Aura console</text>
    <line x1="164" y1="532" x2="200" y2="532" stroke="#374151" stroke-width="1.75" marker-end="url(#arrow)"/>

    <rect x="200" y="504" width="340" height="56" rx="8" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="370" y="527" font-size="15" font-weight="700" text-anchor="middle">Aura</text>
    <text x="370" y="548" text-anchor="middle">Schema discovery and instance setup</text>

    <!-- Aura up to instance -->
    <line x1="480" y1="504" x2="480" y2="418" stroke="#374151" stroke-width="1.75" marker-end="url(#arrow)"/>
    <rect x="412" y="430" width="136" height="20" fill="#FFFFFF"/>
    <text x="480" y="444" font-size="12" text-anchor="middle">creates and configures</text>

    <!-- Aura to S3 Tables -->
    <path d="M540 532 H905 V418" fill="none" stroke="#374151" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="608" y="522" width="228" height="20" fill="#FFFFFF"/>
    <text x="722" y="536" font-size="12" text-anchor="middle">table and column metadata, read-only</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d">
  <title id="t">Neo4j Virtual Graph on AWS</title>
  <desc id="d">Cypher clients, including the Aura console, Query, Bloom, Explore, Aura Agent and drivers, send Cypher to an Aura Virtual Graph instance. The instance translates Cypher into SQL and queries the Iceberg tables in an Amazon S3 table bucket in place.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="400" fill="#FFFFFF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1F2937">

    <text x="500" y="50" font-size="28" font-weight="700" text-anchor="middle">Neo4j Virtual Graph on AWS</text>

    <!-- Cypher clients -->
    <rect x="40" y="90" width="220" height="270" rx="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="150" y="126" font-size="19" font-weight="700" text-anchor="middle">Cypher clients</text>
    <g font-size="17" text-anchor="middle" fill="#374151">
      <text x="150" y="168">Aura console</text>
      <text x="150" y="200">Query</text>
      <text x="150" y="232">Bloom</text>
      <text x="150" y="264">Explore</text>
      <text x="150" y="296">Aura Agent</text>
      <text x="150" y="328">drivers</text>
    </g>

    <!-- Arrow: clients to Virtual Graph -->
    <line x1="262" y1="225" x2="338" y2="225" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="300" y="213" font-size="15" font-style="italic" fill="#6B7280" text-anchor="middle">Cypher</text>

    <!-- Virtual Graph instance -->
    <rect x="340" y="130" width="250" height="190" rx="14" fill="#F5F9FE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="465" y="205" font-size="21" font-weight="700" text-anchor="middle">Aura Virtual Graph</text>
    <text x="465" y="231" font-size="21" font-weight="700" text-anchor="middle">instance</text>
    <text x="465" y="270" font-size="16" font-style="italic" fill="#6B7280" text-anchor="middle">Translates Cypher into SQL</text>

    <!-- Arrow: Virtual Graph to S3 Tables -->
    <line x1="592" y1="225" x2="728" y2="225" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="660" y="213" font-size="15" font-style="italic" fill="#6B7280" text-anchor="middle">Queries in place</text>

    <!-- Amazon S3 Tables -->
    <rect x="730" y="90" width="230" height="270" rx="12" fill="#FFF4E5" stroke="#E8890C" stroke-width="2.5"/>
    <text x="845" y="126" font-size="19" font-weight="700" text-anchor="middle">Amazon S3 Tables</text>
    <rect x="750" y="145" width="190" height="195" rx="10" fill="#FFFFFF" stroke="#E8890C" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="845" y="171" font-size="16" text-anchor="middle" fill="#374151">Table bucket</text>
    <rect x="768" y="187" width="154" height="137" rx="8" fill="#FFFFFF" stroke="#E8890C" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="845" y="212" font-size="16" text-anchor="middle" fill="#374151">Namespace</text>
    <rect x="784" y="230" width="122" height="78" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="2"/>
    <text x="845" y="274" font-size="15" font-weight="600" text-anchor="middle">Iceberg tables</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1000 340" width="1000" height="340" role="img" aria-labelledby="t d">
  <title id="t">Graph model</title>
  <desc id="d">Account nodes from the accounts table connect to other Account nodes through TRANSFERRED_TO relationships from account_links, and to Merchant nodes from the merchants table through TRANSACTED_WITH relationships from transactions.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="380" fill="#FFFFFF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- TRANSFERRED_TO self-loop on Account -->
    <path d="M225,183 C140,40 380,40 295,183" fill="none" stroke="#4B5563" stroke-width="2.5" marker-end="url(#head)"/>
    <text x="360" y="92" font-size="18" font-weight="700" fill="#1F2937">TRANSFERRED_TO</text>
    <text x="360" y="116" font-size="15" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">account_links</text>

    <!-- TRANSACTED_WITH from Account to Merchant -->
    <line x1="332" y1="245" x2="668" y2="245" stroke="#4B5563" stroke-width="2.5" marker-end="url(#head)"/>
    <text x="500" y="230" font-size="18" font-weight="700" fill="#1F2937" text-anchor="middle">TRANSACTED_WITH</text>
    <text x="500" y="272" font-size="15" fill="#6B7280" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">transactions</text>

    <!-- Nodes -->
    <circle cx="260" cy="245" r="70" fill="#2563EB"/>
    <text x="260" y="252" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Account</text>
    <text x="260" y="346" font-size="15" fill="#6B7280" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">accounts</text>

    <circle cx="740" cy="245" r="70" fill="#059669"/>
    <text x="740" y="252" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Merchant</text>
    <text x="740" y="346" font-size="15" fill="#6B7280" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">merchants</text>
  </g>
</svg>

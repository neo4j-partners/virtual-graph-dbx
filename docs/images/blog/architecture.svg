<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 612" width="1000" height="612" role="img" aria-labelledby="t d">
  <title id="t">Virtual Graph architecture</title>
  <desc id="d">Applications, agents, notebooks, and BI tools send Cypher or GQL to a Virtual Graph instance on Neo4j Aura, which pushes filters down to Snowflake, Databricks, Google BigQuery, and Amazon S3 Tables.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="612" fill="#FFFFFF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1F2937">

    <text x="500" y="48" font-size="30" font-weight="700" text-anchor="middle">Architecture</text>

    <!-- Clients -->
    <g font-size="18" font-weight="700" text-anchor="middle">
      <rect x="75" y="80" width="190" height="72" rx="10" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="170" y="122">Applications</text>
      <rect x="295" y="80" width="190" height="72" rx="10" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="390" y="122">Agents</text>
      <rect x="515" y="80" width="190" height="72" rx="10" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="610" y="122">Notebooks</text>
      <rect x="735" y="80" width="190" height="72" rx="10" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="830" y="122">BI tools</text>
    </g>

    <line x1="500" y1="154" x2="500" y2="210" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="516" y="188" font-size="16" font-style="italic" fill="#6B7280">Cypher / GQL</text>

    <!-- Virtual Graph instance -->
    <rect x="50" y="212" width="900" height="230" rx="14" fill="#F5F9FE" stroke="#2563EB" stroke-width="2"/>
    <text x="80" y="250" font-size="20" font-weight="700">Virtual Graph on Neo4j Aura</text>

    <g text-anchor="middle">
      <rect x="80" y="272" width="260" height="140" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
      <text x="210" y="326" font-size="18" font-weight="700">AI-generated data model</text>
      <text x="210" y="354" font-size="15" font-style="italic" fill="#6B7280">Tables become nodes</text>
      <text x="210" y="374" font-size="15" font-style="italic" fill="#6B7280">and relationships</text>

      <rect x="370" y="272" width="260" height="140" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
      <text x="500" y="334" font-size="18" font-weight="700">Query translator</text>
      <text x="500" y="362" font-size="15" font-style="italic" fill="#6B7280">Pushes down or computes here</text>

      <rect x="660" y="272" width="260" height="140" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
      <text x="790" y="334" font-size="18" font-weight="700">Graph compute layer</text>
      <text x="790" y="362" font-size="15" font-style="italic" fill="#6B7280">Patterns, traversals, algorithms</text>
    </g>

    <line x1="500" y1="442" x2="500" y2="500" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="516" y="477" font-size="16" font-style="italic" fill="#6B7280">Pushed down: filters</text>

    <!-- Sources -->
    <g font-size="18" font-weight="700" text-anchor="middle">
      <rect x="55" y="502" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
      <text x="155" y="550">Snowflake</text>
      <rect x="285" y="502" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
      <text x="385" y="550">Databricks</text>
      <rect x="515" y="502" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
      <text x="615" y="550">Google BigQuery</text>
      <rect x="745" y="502" width="200" height="84" rx="10" fill="#FFF4E5" stroke="#E8890C" stroke-width="3"/>
      <text x="845" y="540">Amazon S3 Tables</text>
      <text x="845" y="564" font-size="15" font-weight="400" font-style="italic" fill="#6B7280">Iceberg</text>
    </g>
  </g>
</svg>

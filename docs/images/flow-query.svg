<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 792" width="960" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1F2937">
  <title id="t">Query flow for Neo4j Virtual Graph on AWS</title>
  <desc id="d">One Cypher query travels over Bolt to the Graph Engine, is translated to SQL, runs in embedded DuckDB against Iceberg tables in Amazon S3 Tables, and returns to the client as graph results.</desc>
  <rect width="960" height="792" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Client lane -->
  <rect x="12" y="12" width="936" height="110" rx="8" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="28" y="34" font-size="15" font-weight="700">Client</text>

  <!-- Result box (step 7 arrival) -->
  <rect x="24" y="46" width="208" height="60" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="44" cy="65" r="11" fill="#1F2937"/>
  <text x="44" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">7</text>
  <text x="64" y="70" font-size="15" font-weight="700">Graph results</text>
  <text x="40" y="92">Nodes and relationships</text>

  <!-- Step 1: query -->
  <circle cx="262" cy="31" r="11" fill="#1F2937"/>
  <text x="262" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
  <text x="280" y="36" font-size="15" font-weight="700">Sends Cypher over Bolt</text>
  <text x="760" y="36" text-anchor="end" font-size="12" font-style="italic" fill="#6B7280">Illustrative query</text>
  <rect x="252" y="48" width="508" height="58" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <text x="264" y="66">MATCH (a:Account {accountId: $flagged})</text>
    <text x="285" y="81">-[:TRANSFERRED_TO]-&gt;(:Account)-[:TRANSFERRED_TO]-&gt;(c:Account)</text>
    <text x="264" y="96">RETURN DISTINCT c.accountId</text>
  </g>

  <!-- Virtual Graph instance -->
  <rect x="12" y="146" width="700" height="603" rx="8" fill="#F7FAFE" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="48" y="168"><tspan font-size="15" font-weight="700">Graph Engine</tspan><tspan dx="8" font-size="12" fill="#6B7280">inside the Virtual Graph instance</tspan></text>
  <text x="488" y="168" font-size="15" font-weight="700">Embedded DuckDB</text>

  <!-- Step 2 -->
  <rect x="48" y="184" width="392" height="95" rx="8" fill="#E8F1FB" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="68" cy="203" r="11" fill="#1F2937"/>
  <text x="68" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
  <text x="88" y="208" font-size="15" font-weight="700">Parse and resolve</text>
  <text x="64" y="230">Parse to an AST. Resolve labels:</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <text x="64" y="250">:Account maps to table accounts</text>
    <text x="64" y="265">TRANSFERRED_TO maps to table account_links</text>
  </g>

  <!-- Step 3 -->
  <rect x="48" y="297" width="392" height="96" rx="8" fill="#E8F1FB" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="68" cy="316" r="11" fill="#1F2937"/>
  <text x="68" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
  <text x="88" y="321" font-size="15" font-weight="700">Rewrite and simplify</text>
  <text x="64" y="343">Build a relational AST. Each hop becomes a</text>
  <text x="64" y="361">join from account_links back to accounts on</text>
  <text x="64" y="379">the mapped source and destination keys.</text>

  <!-- Step 4 -->
  <rect x="48" y="411" width="392" height="114" rx="8" fill="#E8F1FB" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="68" cy="430" r="11" fill="#1F2937"/>
  <text x="68" y="434" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
  <text x="88" y="435" font-size="15" font-weight="700">Render DuckDB SQL</text>
  <text x="64" y="457">Targets catalog virtual_graph and the</text>
  <text x="64" y="475">namespace from schema.json.</text>
  <text x="64" y="495" font-size="12" fill="#6B7280">Quantified path patterns such as {1,10}</text>
  <text x="64" y="511" font-size="12" fill="#6B7280">render as WITH RECURSIVE.</text>

  <!-- Step 5 -->
  <rect x="48" y="543" width="392" height="62" rx="8" fill="#E8F1FB" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="68" cy="562" r="11" fill="#1F2937"/>
  <text x="68" y="566" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">5</text>
  <text x="88" y="567" font-size="15" font-weight="700">JDBC external operator</text>
  <text x="64" y="589">Sends the SQL to embedded DuckDB.</text>

  <!-- Step 7 -->
  <rect x="48" y="623" width="392" height="114" rx="8" fill="#E8F1FB" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="68" cy="642" r="11" fill="#1F2937"/>
  <text x="68" y="646" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">7</text>
  <text x="88" y="647" font-size="15" font-weight="700">Shape and return</text>
  <rect x="296" y="630" width="128" height="22" rx="11" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="360" y="645" text-anchor="middle" font-size="12">No ETL, no cache</text>
  <text x="64" y="669">Rows stream back over JDBC. The engine shapes</text>
  <text x="64" y="687">them into Account nodes and relationships,</text>
  <text x="64" y="705">returns them to the client, and discards the</text>
  <text x="64" y="723">graph when the query ends.</text>

  <!-- Step 6: DuckDB -->
  <rect x="488" y="443" width="208" height="294" rx="8" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.5"/>
  <circle cx="508" cy="462" r="11" fill="#1F2937"/>
  <text x="508" y="466" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">6</text>
  <text x="528" y="467" font-size="15" font-weight="700">DuckDB executes</text>
  <text x="504" y="489">Reads Iceberg metadata</text>
  <text x="504" y="507">and data from S3 Tables</text>
  <text x="504" y="525">over the Iceberg REST</text>
  <text x="504" y="543">endpoint. The accountId</text>
  <text x="504" y="561">filter is pushed into</text>
  <text x="504" y="579">the Iceberg scan. Joins</text>
  <text x="504" y="597">run inside DuckDB.</text>
  <rect x="504" y="611" width="176" height="44" rx="6" fill="#FFFFFF" stroke="#CA8A04" stroke-width="1.5"/>
  <text x="514" y="629" font-size="12">leaf filters pushed into</text>
  <text x="514" y="645" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ICEBERG_SCAN</text>
  <rect x="504" y="665" width="176" height="58" rx="6" fill="#FFFFFF" stroke="#CA8A04" stroke-width="1.5"/>
  <text x="514" y="683" font-size="12">joins run in DuckDB,</text>
  <text x="514" y="699" font-size="12">memory bound by the</text>
  <text x="514" y="715" font-size="12">instance</text>

  <!-- Amazon S3 Tables -->
  <rect x="768" y="443" width="180" height="131" rx="8" fill="#FFFAF2" stroke="#E8890C" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="858" y="467" text-anchor="middle" font-size="15" font-weight="700">Amazon S3 Tables</text>
  <rect x="780" y="480" width="156" height="76" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.5"/>
  <text x="796" y="504" font-size="15" font-weight="700">Iceberg tables</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <text x="796" y="526">accounts</text>
    <text x="796" y="542">account_links</text>
  </g>

  <!-- Arrows -->
  <g stroke="#374151" stroke-width="1.75" fill="none" marker-end="url(#arrow)">
    <path d="M408 106 L408 183"/>
    <path d="M244 279 L244 296"/>
    <path d="M244 393 L244 410"/>
    <path d="M244 525 L244 542"/>
    <path d="M440 574 L487 574"/>
    <path d="M488 680 L441 680"/>
    <path d="M696 518 L779 518"/>
    <path d="M48 680 L36 680 L36 107"/>
  </g>

  <!-- Arrow labels -->
  <g font-size="12">
    <rect x="414" y="126" width="36" height="16" fill="#FFFFFF"/>
    <text x="432" y="138" text-anchor="middle">Bolt</text>
    <rect x="448" y="557" width="32" height="16" fill="#FFFFFF"/>
    <text x="464" y="569" text-anchor="middle">SQL</text>
    <rect x="448" y="663" width="32" height="16" fill="#FFFFFF"/>
    <text x="464" y="675" text-anchor="middle">Rows</text>
    <rect x="716" y="484" width="48" height="30" fill="#FFFFFF"/>
    <text x="740" y="497" text-anchor="middle">Iceberg</text>
    <text x="740" y="510" text-anchor="middle">REST</text>
  </g>

  <!-- Footer -->
  <text x="12" y="777" fill="#374151">Predicates are pushed down. Join conditions are not pushed to the source.</text>
</svg>
